name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-quality:
    name: JS Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  expo-integrity:
    name: Expo Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run doctor
      - run: npm run check:native:verify

  android-build:
    name: Android Clean Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
      - run: npm ci
      - run: npm run prebuild:android
      - name: Build Android
        run: cd android && ./gradlew assembleDebug
