name: Release APKs

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npm run prebuild:android

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.arch }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk monowave-${{ matrix.arch }}.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: monowave-${{ matrix.arch }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
