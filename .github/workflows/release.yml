name: Release APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.arch }}

      - name: Rename APK
        run: |
          # Find the generated APK (could be app-release.apk or app-armeabi-v7a-release.apk)
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mv "$APK_PATH" monowave-${{ matrix.arch }}.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: monowave-${{ matrix.arch }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
